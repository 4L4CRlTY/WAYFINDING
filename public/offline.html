<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18375d">
    <title>Offline - SLSU Campus Navigator</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #071522;
            color: #f6fbff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 18%, rgba(41, 192, 237, 0.18), transparent 34%),
                radial-gradient(circle at 85% 78%, rgba(24, 55, 93, 0.72), transparent 38%),
                linear-gradient(145deg, #071522, #0a2135 54%, #102d4e);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;
            background-image:
                linear-gradient(rgba(83, 202, 240, 0.22) 1px, transparent 1px),
                linear-gradient(90deg, rgba(83, 202, 240, 0.22) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 82%);
        }

        main {
            position: relative;
            width: min(520px, 100%);
            padding: clamp(28px, 7vw, 48px);
            border: 1px solid rgba(90, 207, 244, 0.32);
            border-radius: 30px;
            background: linear-gradient(145deg, rgba(24, 55, 93, 0.94), rgba(7, 21, 34, 0.96));
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42), inset 0 1px rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .logo {
            width: 86px;
            height: 86px;
            padding: 7px;
            border: 1px solid rgba(90, 207, 244, 0.45);
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 34px rgba(46, 204, 248, 0.25);
        }

        .eyebrow {
            margin-top: 22px;
            color: #5ad9ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0 12px;
            font-size: clamp(30px, 8vw, 46px);
            line-height: 1.02;
        }

        p {
            margin: 0 auto;
            max-width: 410px;
            color: #b9d0df;
            font-size: 15px;
            line-height: 1.65;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 26px 0 18px;
            padding: 9px 13px;
            border: 1px solid rgba(255, 190, 92, 0.28);
            border-radius: 999px;
            color: #ffd28b;
            background: rgba(255, 174, 64, 0.08);
            font-size: 12px;
            font-weight: 750;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffb347;
            box-shadow: 0 0 12px #ffb347;
        }

        button {
            width: 100%;
            min-height: 48px;
            border: 1px solid rgba(90, 217, 255, 0.58);
            border-radius: 15px;
            color: #ffffff;
            background: linear-gradient(135deg, #1d86c6, #18375d);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 3px solid #5ad9ff;
            outline-offset: 3px;
        }

        small {
            display: block;
            margin-top: 18px;
            color: #7895a8;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/icons/pwa-icon-192.png" alt="SLSU logo">
        <div class="eyebrow">Campus Navigator</div>
        <h1>You are offline.</h1>
        <p>
            An already-open navigation session can keep using saved campus data and GPS.
            Reconnect once to sign in, refresh map changes, or start a new session.
        </p>
        <div class="status" id="offline-status">Waiting for connection</div>
        <button type="button" id="retry-button">Try Again</button>
        <small>This offline screen stores no account or location information.</small>
    </main>

    <script>
        const retryButton = document.getElementById('retry-button');
        const status = document.getElementById('offline-status');

        function retry() {
            status.textContent = navigator.onLine
                ? 'Connection found - opening navigator'
                : 'Still offline - please check your connection';

            if (navigator.onLine) {
                window.location.replace('/user/dashboard');
            }
        }

        retryButton.addEventListener('click', retry);
        window.addEventListener('online', retry);
    </script>
</body>
</html>
